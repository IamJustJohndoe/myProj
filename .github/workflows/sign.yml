name: Sign with Cosign (Modern)

on:
  push:
    branches: [ main ]

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Critical for OIDC
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cosign
        run: |
          curl -LO https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign-linux-amd64
          sudo mv cosign-linux-amd64 /usr/local/bin/cosign
          cosign version

      - name: Sign the artifact
        id: sign
        run: |
          FILE_NAME="Invitation.exe"
          
          # Use --bundle to output a single file containing both sig and cert
          cosign sign-blob \
            --yes \
            --bundle "${FILE_NAME}.sig.bundle" \
            "$FILE_NAME"
          
          echo "signed_file=${FILE_NAME}" >> $GITHUB_OUTPUT
          echo "bundle=${FILE_NAME}.sig.bundle" >> $GITHUB_OUTPUT

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-files
          path: |
            *.exe
            *.bundle
