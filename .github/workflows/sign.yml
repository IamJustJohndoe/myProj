name: Sign with Cosign

on:
  push:
    branches: [ main ]

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for OIDC signing
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cosign
        run: |
          curl -LO https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign-linux-amd64
          sudo mv cosign-linux-amd64 /usr/local/bin/cosign
          cosign version

      - name: Sign the artifact
        id: sign
        run: |
          # Replace 'your-file.exe' with your actual file name
          FILE_NAME="Invitation.exe"
          
          # Sign the file using keyless mode (OIDC)
          cosign sign-blob \
            --yes \
            --output-signature "${FILE_NAME}.sig" \
            --output-certificate "${FILE_NAME}.cert" \
            "$FILE_NAME"
          
          echo "signed_file=${FILE_NAME}" >> $GITHUB_OUTPUT
          echo "signature=${FILE_NAME}.sig" >> $GITHUB_OUTPUT
          echo "certificate=${FILE_NAME}.cert" >> $GITHUB_OUTPUT

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-files
          path: |
            *.exe
            *.sig
            *.cert
